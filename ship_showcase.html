<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ship Showcase // Scale Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 15px; left: 15px;
    color: #0ff; font: 14px monospace;
    pointer-events: none; z-index: 10;
    text-shadow: 0 0 8px #0ff;
  }
  #help {
    position: fixed; bottom: 15px; left: 15px;
    color: #888; font: 12px monospace;
    pointer-events: none; z-index: 10;
  }
  #shipinfo {
    position: fixed; top: 15px; right: 15px;
    color: #fff; font: 14px monospace;
    pointer-events: none; z-index: 10;
    text-align: right;
    text-shadow: 0 0 6px #fff;
  }
</style>
</head>
<body>
<div id="hud"></div>
<div id="shipinfo"></div>
<div id="help">
  SCROLL to zoom &bull; DRAG to pan &bull; CLICK ship to trigger ability &bull; 1-6 to focus ship class
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hudEl = document.getElementById('hud');
const infoEl = document.getElementById('shipinfo');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ============================================================
// CAMERA
// ============================================================
const camera = {
  x: 0, y: 0,        // world position (center of view)
  zoom: 0.15,         // pixels per meter
  targetZoom: 0.15,
  targetX: 0, targetY: 0,
  smoothing: 0.08
};

function worldToScreen(wx, wy) {
  return [
    (wx - camera.x) * camera.zoom + W / 2,
    (wy - camera.y) * camera.zoom + H / 2
  ];
}

function screenToWorld(sx, sy) {
  return [
    (sx - W / 2) / camera.zoom + camera.x,
    (sy - H / 2) / camera.zoom + camera.y
  ];
}

// ============================================================
// SHIP DEFINITIONS — vertex geometry
// ============================================================
// All coordinates in meters, centered at (0,0)

function makeSkiff() {
  // ~10m, fast interceptor wedge
  const hull = [
    [5, 0], [3, 1.2], [1, 1.8], [-3, 2.5], [-5, 2], [-4.5, 0.8],
    [-5, 0], // center notch
    [-4.5, -0.8], [-5, -2], [-3, -2.5], [1, -1.8], [3, -1.2]
  ];
  // cockpit canopy
  const cockpit = [
    [4, 0], [2.5, 0.8], [1, 0.6], [1, -0.6], [2.5, -0.8]
  ];
  // engine nozzles
  const engineL = [[-5, 1.2], [-6.5, 1.5], [-6.5, 0.5], [-5, 0.8]];
  const engineR = [[-5, -0.8], [-6.5, -0.5], [-6.5, -1.5], [-5, -1.2]];
  // wing fins
  const finL = [[0, 1.8], [-1, 3.5], [-3, 3.2], [-2, 2.2]];
  const finR = [[0, -1.8], [-1, -3.5], [-3, -3.2], [-2, -2.2]];
  return {
    parts: [
      { verts: hull, stroke: '#0ff', fill: 'rgba(0,255,255,0.08)', width: 1.5 },
      { verts: cockpit, stroke: '#0ff', fill: 'rgba(0,255,255,0.25)', width: 1 },
      { verts: engineL, stroke: '#f80', fill: 'rgba(255,136,0,0.3)', width: 1 },
      { verts: engineR, stroke: '#f80', fill: 'rgba(255,136,0,0.3)', width: 1 },
      { verts: finL, stroke: '#088', fill: 'rgba(0,136,136,0.15)', width: 1 },
      { verts: finR, stroke: '#088', fill: 'rgba(0,136,136,0.15)', width: 1 },

}

  // engine block

function makeDestroyer() {
  // ~400m, fat & aggressive broadside brawler — wide beam
  const hull = [
    [200, 0], [180, 25], [120, 50], [40, 65], [-40, 70], [-120, 68], [-180, 55], [-200, 35],
    [-200, -35], [-180, -55], [-120, -68], [-40, -70], [40, -65], [120, -50], [180, -25]
  ];
  // armored prow (blunt wedge)
  const prow = [[200, 0], [190, 18], [160, 30], [120, 30], [120, -30], [160, -30], [190, -18]];
  // command tower (wide)
  const tower = [[60, 25], [30, 45], [-30, 48], [-60, 40], [-60, -40], [-30, -48], [30, -45], [60, -25]];
  // broadside gun arrays (6 per side)
  const gunsL = [], gunsR = [];
  for (let i = 0; i < 6; i++) {
    const x = 120 - i * 50;
    gunsL.push({ verts: [[x, 55 + i*2], [x+10, 65 + i*2], [x+5, 78 + i*2], [x-5, 78 + i*2], [x-10, 65 + i*2]],
      stroke: '#ff8', fill: 'rgba(255,255,136,0.15)', width: 1 });
    gunsR.push({ verts: [[x, -55 - i*2], [x+10, -65 - i*2], [x+5, -78 - i*2], [x-5, -78 - i*2], [x-10, -65 - i*2]],
      stroke: '#ff8', fill: 'rgba(255,255,136,0.15)', width: 1 });
  }
  // engine array (wider spread)
  const engines = [];
  for (let i = -3; i <= 3; i++) {
    engines.push({ verts: [[-200, i*9+4], [-218, i*9+3], [-218, i*9-3], [-200, i*9-4]],
      stroke: '#f80', fill: 'rgba(255,136,0,0.3)', width: 1 });
  }
  // spine detail (wider)
  const spine = [[100, 8], [50, 12], [-50, 12], [-100, 8], [-100, -8], [-50, -12], [50, -12], [100, -8]];
  // armor belt (side plating)
  const beltL = [[80, 50], [20, 62], [-60, 65], [-120, 60], [-100, 50], [-20, 48], [60, 42]];
  const beltR = [[80, -50], [20, -62], [-60, -65], [-120, -60], [-100, -50], [-20, -48], [60, -42]];

  return {
    parts: [
      { verts: hull, stroke: '#ff0', fill: 'rgba(255,255,0,0.04)', width: 2 },
      { verts: prow, stroke: '#ff0', fill: 'rgba(255,255,0,0.1)', width: 1.5 },
      { verts: tower, stroke: '#ff0', fill: 'rgba(255,255,0,0.1)', width: 1.5 },
      { verts: spine, stroke: '#880', fill: 'rgba(136,136,0,0.08)', width: 1 },

    ],
    length: 400, name: 'DESTROYER', size: '400m',
    color: '#ff0', abilityName: 'BROADSIDE',
    abilityColor: '#ff0'
  };
}

      { verts: turretT1, stroke: '#f88', fill: 'rgba(255,136,136,0.15)', width: 1 },

function makeMothership() {
  // ~2000m, hexagonal carrier
  const R = 900; // hex outer radius
  const r = R * Math.cos(Math.PI / 6); // hex inner radius (~780)
  // Main hexagonal hull
  const hull = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6; // flat-top hex
    hull.push([Math.cos(a) * R, Math.sin(a) * R]);
  }
  // Inner hex (command ring)
  const inner = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
    inner.push([Math.cos(a) * R * 0.5, Math.sin(a) * R * 0.5]);
  }
  // Central bridge
  const bridge = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
    bridge.push([Math.cos(a) * R * 0.2, Math.sin(a) * R * 0.2]);
  }
  // Spokes connecting inner to outer hex
  const spokes = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const cos = Math.cos(a), sin = Math.sin(a);
    const w = 25;
    const pa = a + Math.PI / 2;
    const dx = Math.cos(pa) * w, dy = Math.sin(pa) * w;
    spokes.push({ verts: [
      [cos * R * 0.52 + dx, sin * R * 0.52 + dy],
      [cos * R * 0.95 + dx, sin * R * 0.95 + dy],
      [cos * R * 0.95 - dx, sin * R * 0.95 - dy],
      [cos * R * 0.52 - dx, sin * R * 0.52 - dy],
    ], stroke: '#66c', fill: 'rgba(100,100,200,0.06)', width: 1.5 });
  }
  // Launch bays (on each face of the hex, between spokes)
  const bays = [];
  for (let i = 0; i < 6; i++) {
    const a1 = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const a2 = ((i + 1) / 6) * Math.PI * 2 - Math.PI / 6;
    const mid = (a1 + a2) / 2;
    const bx = Math.cos(mid) * R * 0.72;
    const by = Math.sin(mid) * R * 0.72;
    const pa = mid + Math.PI / 2;
    const bw = 60, bh = 30;
    bays.push({ verts: [
      [bx + Math.cos(mid)*bh + Math.cos(pa)*bw, by + Math.sin(mid)*bh + Math.sin(pa)*bw],
      [bx - Math.cos(mid)*bh + Math.cos(pa)*bw, by - Math.sin(mid)*bh + Math.sin(pa)*bw],
      [bx - Math.cos(mid)*bh - Math.cos(pa)*bw, by - Math.sin(mid)*bh - Math.sin(pa)*bw],
      [bx + Math.cos(mid)*bh - Math.cos(pa)*bw, by + Math.sin(mid)*bh - Math.sin(pa)*bw],
    ], stroke: '#48f', fill: 'rgba(68,136,255,0.12)', width: 1.5 });
  }
  // Engine cluster (along the rear face — the leftmost hex edge)
  const engines = [];
  const engA = Math.PI; // pointing left
  for (let i = -3; i <= 3; i++) {
    const ey = i * 30;
    engines.push({ verts: [[-R - 10, ey+12], [-R - 55, ey+8], [-R - 55, ey-8], [-R - 10, ey-12]],
      stroke: '#f80', fill: 'rgba(255,136,0,0.3)', width: 2 });
  }
  // Antennae on top and bottom vertices
  const ant1 = [[0, -R-10], [-20, -R-60], [20, -R-60]];
  const ant2 = [[0, R+10], [-20, R+60], [20, R+60]];

  return {
    parts: [
      { verts: hull, stroke: '#88f', fill: 'rgba(136,136,255,0.03)', width: 3 },
      { verts: inner, stroke: '#88f', fill: 'rgba(136,136,255,0.05)', width: 2 },
      { verts: bridge, stroke: '#aaf', fill: 'rgba(170,170,255,0.1)', width: 2 },
      ...spokes, ...bays,
      { verts: ant1, stroke: '#ff0', fill: 'rgba(255,255,0,0.15)', width: 1 },
      { verts: ant2, stroke: '#ff0', fill: 'rgba(255,255,0,0.15)', width: 1 },
      ...engines,
    ],
    length: 2000, name: 'MOTHERSHIP', size: '2000m',
    color: '#88f', abilityName: 'DEPLOY FIGHTERS',
    abilityColor: '#48f'
  };
}

// ============================================================
// SHIP INSTANCES
// ============================================================
const shipDefs = [makeSkiff(), makeCorvette(), makeFrigate(), makeDestroyer(), makeCruiser(), makeMothership()];

// Place ships in world space with spacing
const ships = [];
let placeX = 0;
for (let i = 0; i < shipDefs.length; i++) {
  const def = shipDefs[i];
  ships.push({
    def,
    x: placeX,
    y: 0,
    angle: 0,
    ability: null, // active ability animation state
    enginePhase: Math.random() * Math.PI * 2,
  });
  const nextLen = i < shipDefs.length - 1 ? shipDefs[i + 1].length : 0;
  placeX += def.length * 1.5 + nextLen * 1.5 + 50;
}

// ============================================================
// ABILITY ANIMATIONS
// ============================================================
// Each ability is a { type, timer, maxTimer, ... } object

function triggerAbility(ship) {
  const name = ship.def.abilityName;
  switch (name) {
    case 'AFTERBURNER':
      ship.ability = { type: 'afterburner', timer: 0, maxTimer: 90 };
      break;
    case 'MISSILE SALVO':
      ship.ability = { type: 'missiles', timer: 0, maxTimer: 120, missiles: [] };
      break;
    case 'SHIELD BUBBLE':
      ship.ability = { type: 'shield', timer: 0, maxTimer: 150 };
      break;
    case 'BROADSIDE':
      ship.ability = { type: 'broadside', timer: 0, maxTimer: 100, flashes: [] };
      break;
    case 'ENERGY LANCE':
      ship.ability = { type: 'lance', timer: 0, maxTimer: 120 };
      break;
    case 'DEPLOY FIGHTERS':
      ship.ability = { type: 'fighters', timer: 0, maxTimer: 180, fighters: [] };
      break;
  }
}

// ============================================================
// PARTICLES
// ============================================================
let particles = [];
function spawnP(x, y, vx, vy, color, life, size) {
  particles.push({ x, y, vx, vy, color, life, maxLife: life, size });
}

// ============================================================
// STARS
// ============================================================
const stars = Array.from({length: 500}, () => ({
  x: (Math.random() - 0.5) * 20000,
  y: (Math.random() - 0.5) * 5000,
  size: Math.random() * 1.5 + 0.5,
  brightness: Math.random() * 0.4 + 0.2
}));

// ============================================================
// INPUT
// ============================================================
let dragging = false, dragStartX, dragStartY, camStartX, camStartY;
let selectedShip = null;

canvas.addEventListener('mousedown', e => {
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  camStartX = camera.targetX; camStartY = camera.targetY;
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  camera.targetX = camStartX - dx / camera.zoom;
  camera.targetY = camStartY - dy / camera.zoom;
});
canvas.addEventListener('mouseup', e => {
  const dist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
  dragging = false;
  if (dist < 5) {
    // click — check for ship hit
    const [wx, wy] = screenToWorld(e.clientX, e.clientY);
    for (const s of ships) {
      const r = s.def.length * 0.6;
      if (Math.hypot(wx - s.x, wy - s.y) < r) {
        selectedShip = s;
        triggerAbility(s);
        break;
      }
    }
  }
});
canvas.addEventListener('wheel', e => {
  const factor = e.deltaY > 0 ? 0.85 : 1.18;
  camera.targetZoom = Math.max(0.003, Math.min(20, camera.targetZoom * factor));
  e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
  const idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx < ships.length) {
    const s = ships[idx];
    camera.targetX = s.x;
    camera.targetY = s.y;
    // zoom to fit ship nicely
    camera.targetZoom = Math.min(40, W / (s.def.length * 4));
    selectedShip = s;
    triggerAbility(s);
  }
});

// ============================================================
// DRAW HELPERS
// ============================================================
function drawPolyWorld(verts, ox, oy, angle, stroke, fill, lineWidth, glow) {
  ctx.save();
  const [sx, sy] = worldToScreen(ox, oy);
  ctx.translate(sx, sy);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.rotate(angle);
  if (glow > 0) { ctx.shadowColor = stroke; ctx.shadowBlur = glow; }
  ctx.beginPath();
  ctx.moveTo(verts[0][0], verts[0][1]);
  for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i][0], verts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.strokeStyle = stroke;
  ctx.lineWidth = lineWidth / camera.zoom; // keep consistent screen-space width
  // but cap min/max for readability
  ctx.lineWidth = Math.max(0.5, Math.min(lineWidth * 3, lineWidth / Math.min(1, camera.zoom)));
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawShip(ship, time) {
  const { def, x, y, angle, enginePhase } = ship;
  const glow = Math.max(5, 15 * Math.min(1, camera.zoom * def.length / 100));

  for (const part of def.parts) {
    drawPolyWorld(part.verts, x, y, angle, part.stroke, part.fill, part.width, glow);
  }

  // Animated engine glow
  const pulse = 0.7 + 0.3 * Math.sin(time * 8 + enginePhase);
  for (const part of def.parts) {
    if (part.stroke === '#f80') {
      // re-draw engine parts with pulsing brightness
      const alpha = 0.3 + 0.4 * pulse;
      drawPolyWorld(part.verts, x, y, angle, '#f80', `rgba(255,136,0,${alpha})`, part.width, glow * pulse * 1.5);
    }
  }

  // Label (only when zoomed enough to read)
  const screenSize = def.length * camera.zoom;
  if (screenSize > 40) {
    const [sx, sy] = worldToScreen(x, y - def.length * 0.5 - 20);
    ctx.fillStyle = def.color;
    ctx.shadowColor = def.color;
    ctx.shadowBlur = 8;
    ctx.font = `${Math.min(16, Math.max(10, screenSize / 8))}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(def.name, sx, sy);
    ctx.shadowBlur = 0;
  }
}

// ============================================================
// ABILITY RENDERING
// ============================================================
function updateAndDrawAbility(ship, time, dt) {
  const ab = ship.ability;
  if (!ab) return;
  ab.timer++;
  const t = ab.timer / ab.maxTimer; // 0..1 progress
  const { x, y, def } = ship;
  const len = def.length;

  switch (ab.type) {
    case 'afterburner': {
      // Massive flame trail behind ship
      const intensity = Math.sin(t * Math.PI); // ramp up then down
      for (let i = 0; i < 3; i++) {
        const spread = (Math.random() - 0.5) * len * 0.4;
        const speed = len * 0.3 + Math.random() * len * 0.2;
        spawnP(x - len * 0.5 + spread * 0.3, y + spread,
          -speed * (0.5 + intensity), (Math.random() - 0.5) * len * 0.1,
          Math.random() > 0.5 ? '#f80' : '#ff0',
          20 + Math.random() * 20, len * 0.05 * intensity + 1);
      }
      break;
    }
    case 'missiles': {
      // Launch missiles that spread outward
      if (ab.timer % 8 === 0 && ab.timer < 60) {
        const my = (Math.random() - 0.5) * len * 0.6;
        ab.missiles.push({
          x: x + len * 0.2, y: y + my,
          vx: len * 0.08 + Math.random() * len * 0.05,
          vy: my * 0.05,
          trail: [], life: 80
        });
      }
      ab.missiles = ab.missiles.filter(m => {
        m.x += m.vx; m.y += m.vy;
        m.vy += (Math.random() - 0.5) * 0.5;
        m.trail.push({ x: m.x, y: m.y });
        if (m.trail.length > 15) m.trail.shift();
        m.life--;
        // draw trail
        if (m.trail.length > 1) {
          ctx.beginPath();
          const [s0x, s0y] = worldToScreen(m.trail[0].x, m.trail[0].y);
          ctx.moveTo(s0x, s0y);
          for (let i = 1; i < m.trail.length; i++) {
            const [tsx, tsy] = worldToScreen(m.trail[i].x, m.trail[i].y);
            ctx.lineTo(tsx, tsy);
          }
          ctx.strokeStyle = '#f44';
          ctx.shadowColor = '#f44';
          ctx.shadowBlur = 6;
          ctx.lineWidth = Math.max(1, 2 * camera.zoom * len * 0.003);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        // draw missile head
        const [mx, my2] = worldToScreen(m.x, m.y);
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#f44';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(mx, my2, Math.max(2, camera.zoom * len * 0.01), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // explode at end of life
        if (m.life <= 0) {
          for (let i = 0; i < 8; i++) {
            const a = Math.random() * Math.PI * 2;
            spawnP(m.x, m.y, Math.cos(a) * len * 0.05, Math.sin(a) * len * 0.05,
              '#f80', 20, len * 0.02);
          }
        }
        return m.life > 0;
      });
      break;
    }
    case 'shield': {
      // Expanding/pulsing hexagonal shield
      const radius = len * 0.7;
      const pulse = 0.9 + 0.1 * Math.sin(time * 10);
      const alpha = Math.sin(t * Math.PI) * 0.6;
      const [sx, sy] = worldToScreen(x, y);
      const sr = radius * camera.zoom * pulse;
      // hexagonal segments
      ctx.save();
      ctx.translate(sx, sy);
      const segments = 6;
      for (let i = 0; i < segments; i++) {
        const a1 = (i / segments) * Math.PI * 2 + time * 0.5;
        const a2 = ((i + 1) / segments) * Math.PI * 2 + time * 0.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a1) * sr, Math.sin(a1) * sr);
        ctx.lineTo(Math.cos(a2) * sr, Math.sin(a2) * sr);
        ctx.closePath();
        ctx.strokeStyle = `rgba(0,255,255,${alpha * (0.5 + 0.5 * Math.sin(time * 6 + i))})`;
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = `rgba(0,255,255,${alpha * 0.05})`;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
      break;
    }
    case 'broadside': {
      // Sequential gun flashes along the sides — 6 guns matching geometry
      const fireRate = 10;
      const startDelay = 10; // brief pause before first shot
      const elapsed = ab.timer - startDelay;
      if (elapsed >= 0 && elapsed % fireRate === 0 && elapsed < fireRate * 6) {
        const gunIdx = Math.floor(elapsed / fireRate);
        // gun x positions match the geometry: 120, 70, 20, -30, -80, -130
        const gunX = 120 - gunIdx * 50;
        ab.flashes.push({ idx: gunIdx, timer: 20,
          x: x + gunX, yTop: y + 65 + gunIdx * 2, yBot: y - 65 - gunIdx * 2 });
      }
      ab.flashes = ab.flashes.filter(f => {
        f.timer--;
        const alpha = f.timer / 20;
        const flashLen = len * 0.15;
        // draw flash lines
        for (const fy of [f.yTop, f.yBot]) {
          const dir = fy > y ? 1 : -1;
          const [fx, ffy] = worldToScreen(f.x, fy);
          const endY = ffy + dir * flashLen * camera.zoom;
          ctx.beginPath();
          ctx.moveTo(fx, ffy);
          ctx.lineTo(fx, endY);
          ctx.strokeStyle = `rgba(255,255,100,${alpha})`;
          ctx.shadowColor = '#ff0';
          ctx.shadowBlur = 20 * alpha;
          ctx.lineWidth = Math.max(2, 4 * camera.zoom);
          ctx.stroke();
          ctx.shadowBlur = 0;
          // muzzle flash
          ctx.beginPath();
          ctx.arc(fx, ffy, Math.max(3, 8 * camera.zoom) * alpha, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,200,${alpha})`;
          ctx.fill();
        }
        // spawn particles
        if (f.timer % 3 === 0) {
          for (const fy of [f.yTop, f.yBot]) {
            const dir = fy > y ? 1 : -1;
            spawnP(f.x, fy, (Math.random()-0.5) * len*0.02, dir * len * 0.08,
              '#ff0', 15, len * 0.01);
          }
        }
        return f.timer > 0;
      });
      break;
    }
    case 'lance': {
      // Charging energy beam that fires forward
      const chargeT = 0.4; // fraction of time spent charging
      const [sx, sy] = worldToScreen(x + len * 0.3, y);
      if (t < chargeT) {
        // charge-up: gathering energy particles toward the front
        const ct = t / chargeT;
        const radius = len * (1 - ct) * 0.8;
        for (let i = 0; i < 2; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = radius * (0.5 + Math.random() * 0.5);
          spawnP(x + len * 0.3 + Math.cos(a) * r, y + Math.sin(a) * r,
            -Math.cos(a) * len * 0.05 * ct, -Math.sin(a) * len * 0.05 * ct,
            '#f44', 10, len * 0.005 * (1 + ct * 2));
        }
        // glowing charge point
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(3, camera.zoom * len * 0.03 * ct * 2), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,68,68,${ct})`;
        ctx.shadowColor = '#f44';
        ctx.shadowBlur = 30 * ct;
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        // FIRE the beam
        const ft = (t - chargeT) / (1 - chargeT);
        const beamAlpha = ft < 0.1 ? ft / 0.1 : (1 - ft);
        const beamLen = len * 5;
        const [ex, ey] = worldToScreen(x + len * 0.3 + beamLen, y);
        const beamWidth = Math.max(3, camera.zoom * len * 0.04 * (1 + Math.sin(time * 30) * 0.2));
        // core beam
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = `rgba(255,100,100,${beamAlpha})`;
        ctx.shadowColor = '#f44';
        ctx.shadowBlur = 30;
        ctx.lineWidth = beamWidth;
        ctx.stroke();
        // bright core
        ctx.strokeStyle = `rgba(255,220,220,${beamAlpha * 0.8})`;
        ctx.lineWidth = beamWidth * 0.4;
        ctx.stroke();
        ctx.shadowBlur = 0;
        // impact sparks
        if (Math.random() > 0.5) {
          spawnP(x + len * 0.3 + beamLen * (0.8 + Math.random() * 0.2),
            y + (Math.random() - 0.5) * len * 0.2,
            (Math.random()-0.5)*len*0.05, (Math.random()-0.5)*len*0.1,
            '#f88', 10, len * 0.01);
        }
      }
      break;
    }
    case 'fighters': {
      // Launch small fighter sprites from bays
      if (ab.timer % 15 === 0 && ab.fighters.length < 18) {
        const bayIdx = Math.floor(Math.random() * 6);
        const a1 = (bayIdx / 6) * Math.PI * 2 - Math.PI / 6;
        const a2 = ((bayIdx + 1) / 6) * Math.PI * 2 - Math.PI / 6;
        const mid = (a1 + a2) / 2;
        const bx = x + Math.cos(mid) * len * 0.36;
        const by = y + Math.sin(mid) * len * 0.36;
        ab.fighters.push({
          x: bx, y: by,
          vx: Math.cos(mid) * len * 0.02 + (Math.random() - 0.5) * len * 0.005,
          vy: Math.sin(mid) * len * 0.02 + (Math.random() - 0.5) * len * 0.005,
          angle: mid,
          life: 120 + Math.random() * 60
        });
      }
      // mini skiff shape
      const miniVerts = [[4, 0], [-2, -2], [-3, 0], [-2, 2]];
      ab.fighters = ab.fighters.filter(f => {
        f.x += f.vx;
        f.y += f.vy;
        f.vx *= 1.01;
        f.angle = Math.atan2(f.vy, f.vx);
        f.life--;
        const alpha = Math.min(1, f.life / 30);
        const scale = len * 0.012;
        const [fx, fy] = worldToScreen(f.x, f.y);
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(camera.zoom * scale, camera.zoom * scale);
        ctx.rotate(f.angle);
        ctx.beginPath();
        ctx.moveTo(miniVerts[0][0], miniVerts[0][1]);
        for (let i = 1; i < miniVerts.length; i++) ctx.lineTo(miniVerts[i][0], miniVerts[i][1]);
        ctx.closePath();
        ctx.strokeStyle = `rgba(68,136,255,${alpha})`;
        ctx.shadowColor = '#48f';
        ctx.shadowBlur = 6;
        ctx.lineWidth = 0.5 / (camera.zoom * scale || 1);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
        // engine trail
        if (f.life % 2 === 0) {
          spawnP(f.x, f.y, -f.vx * 0.3, -f.vy * 0.3, '#48f', 15, len * 0.003);
        }
        return f.life > 0;
      });
      break;
    }
  }

  if (ab.timer >= ab.maxTimer) ship.ability = null;
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = performance.now();
let fps = 0, frameCount = 0, fpsTime = 0;

function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  const time = now / 1000;

  // Smooth camera
  camera.x += (camera.targetX - camera.x) * camera.smoothing;
  camera.y += (camera.targetY - camera.y) * camera.smoothing;
  camera.zoom += (camera.targetZoom - camera.zoom) * camera.smoothing;

  // Clear
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Stars (parallax)
  for (const s of stars) {
    const [sx, sy] = worldToScreen(s.x, s.y);
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.fillStyle = `rgba(255,255,255,${s.brightness})`;
    ctx.fillRect(sx, sy, s.size, s.size);
  }

  // Grid (subtle reference for scale)
  const gridSize = camera.zoom > 0.5 ? 50 : camera.zoom > 0.05 ? 500 : 2000;
  const gridAlpha = Math.min(0.15, camera.zoom * 0.3);
  if (gridAlpha > 0.01) {
    ctx.strokeStyle = `rgba(255,255,255,${gridAlpha})`;
    ctx.lineWidth = 0.5;
    const [tlx, tly] = screenToWorld(0, 0);
    const [brx, bry] = screenToWorld(W, H);
    const startX = Math.floor(tlx / gridSize) * gridSize;
    const startY = Math.floor(tly / gridSize) * gridSize;
    for (let gx = startX; gx < brx; gx += gridSize) {
      const [sx] = worldToScreen(gx, 0);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
    for (let gy = startY; gy < bry; gy += gridSize) {
      const [, sy] = worldToScreen(0, gy);
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    }
  }

  // Draw ships
  for (const s of ships) {
    drawShip(s, time);
    updateAndDrawAbility(s, time, dt);
  }

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life--;
    const alpha = p.life / p.maxLife;
    const [sx, sy] = worldToScreen(p.x, p.y);
    if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) return p.life > 0;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(1, p.size * camera.zoom), 0, Math.PI * 2);
    ctx.fill();
    return p.life > 0;
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // HUD
  frameCount++;
  fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(frameCount / fpsTime); frameCount = 0; fpsTime = 0; }

  const zoomMeters = W / camera.zoom;
  let scaleLabel;
  if (zoomMeters < 100) scaleLabel = `~${Math.round(zoomMeters)}m across`;
  else if (zoomMeters < 2000) scaleLabel = `~${(zoomMeters/1000).toFixed(1)}km across`;
  else scaleLabel = `~${Math.round(zoomMeters/1000)}km across`;

  hudEl.innerHTML = `FPS: ${fps}<br>ZOOM: ${camera.zoom.toFixed(3)} px/m<br>${scaleLabel}`;

  if (selectedShip) {
    infoEl.innerHTML = `${selectedShip.def.name}<br>${selectedShip.def.size}<br><span style="color:${selectedShip.def.abilityColor}">${selectedShip.def.abilityName}</span>`;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
