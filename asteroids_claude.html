<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ASTEROIDS // NEON</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Colors ---
const CYAN = '#0ff';
const MAGENTA = '#f0f';
const YELLOW = '#ff0';
const WHITE = '#fff';
const GREEN = '#0f0';
const ORANGE = '#f80';
const RED = '#f44';
const COLORS = [CYAN, MAGENTA, YELLOW, GREEN, ORANGE];

// --- Input ---
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- Stars ---
const stars = Array.from({length: 200}, () => ({
  x: Math.random() * 2000, y: Math.random() * 2000,
  size: Math.random() * 1.5 + 0.5,
  brightness: Math.random() * 0.5 + 0.3,
  twinkleSpeed: Math.random() * 3 + 1
}));

// --- Particles ---
let particles = [];
function spawnParticles(x, y, color, count, speed, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const v = Math.random() * speed + speed * 0.3;
    particles.push({
      x, y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v,
      life: Math.random() * life + life * 0.5,
      maxLife: life * 1.5,
      color, size: Math.random() * 3 + 1
    });
  }
}

// --- Ship ---
let ship = null;
function createShip() {
  return {
    x: W / 2, y: H / 2, angle: -Math.PI / 2,
    vx: 0, vy: 0, radius: 18,
    invincible: 180, // frames of invincibility on spawn
    thrustFlicker: 0
  };
}
ship = createShip();

const SHIP_VERTICES = [
  [20, 0], [-14, -12], [-8, 0], [-14, 12]
];

// --- Bullets ---
let bullets = [];
let bulletCooldown = 0;

// --- Asteroids ---
let asteroids = [];
function createAsteroid(x, y, size) {
  const numVerts = 8 + Math.floor(Math.random() * 6);
  const verts = [];
  for (let i = 0; i < numVerts; i++) {
    const angle = (i / numVerts) * Math.PI * 2;
    const r = size * (0.7 + Math.random() * 0.3);
    verts.push([Math.cos(angle) * r, Math.sin(angle) * r]);
  }
  const angle = Math.random() * Math.PI * 2;
  const speed = (4 - size / 20) * 0.8 + Math.random() * 0.5;
  return {
    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    angle: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.03,
    size, radius: size, verts,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  };
}

function spawnWave(count) {
  for (let i = 0; i < count; i++) {
    let x, y;
    // spawn away from ship
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (ship && Math.hypot(x - ship.x, y - ship.y) < 200);
    asteroids.push(createAsteroid(x, y, 50 + Math.random() * 20));
  }
}

// --- Game State ---
let score = 0;
let lives = 3;
let wave = 1;
let gameOver = false;
let screenShake = 0;
let respawnTimer = 0;

spawnWave(4);

// --- Helpers ---
function wrap(obj) {
  if (obj.x < -50) obj.x += W + 100;
  if (obj.x > W + 50) obj.x -= W + 100;
  if (obj.y < -50) obj.y += H + 100;
  if (obj.y > H + 50) obj.y -= H + 100;
}

function drawPoly(verts, x, y, angle, color, glow) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(verts[0][0], verts[0][1]);
  for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i][0], verts[i][1]);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function circlesCollide(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y) < a.radius + b.radius;
}

// --- Update ---
function update() {
  if (gameOver) {
    if (keys['Space'] || keys['Enter']) {
      score = 0; lives = 3; wave = 1; gameOver = false;
      asteroids = []; bullets = []; particles = [];
      ship = createShip();
      spawnWave(4);
    }
    return;
  }

  // Ship controls
  if (ship) {
    if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= 0.05;
    if (keys['ArrowRight'] || keys['KeyD']) ship.angle += 0.05;
    if (keys['ArrowUp'] || keys['KeyW']) {
      ship.vx += Math.cos(ship.angle) * 0.15;
      ship.vy += Math.sin(ship.angle) * 0.15;
      ship.thrustFlicker++;
      // thrust particles
      if (Math.random() > 0.3) {
        const bx = ship.x - Math.cos(ship.angle) * 18;
        const by = ship.y - Math.sin(ship.angle) * 18;
        const spread = (Math.random() - 0.5) * 0.8;
        particles.push({
          x: bx, y: by,
          vx: -Math.cos(ship.angle + spread) * (3 + Math.random() * 3) + ship.vx * 0.3,
          vy: -Math.sin(ship.angle + spread) * (3 + Math.random() * 3) + ship.vy * 0.3,
          life: 20 + Math.random() * 15, maxLife: 35,
          color: Math.random() > 0.5 ? ORANGE : YELLOW,
          size: Math.random() * 3 + 1
        });
      }
    } else {
      ship.thrustFlicker = 0;
    }

    // friction
    ship.vx *= 0.995;
    ship.vy *= 0.995;

    // speed cap
    const spd = Math.hypot(ship.vx, ship.vy);
    if (spd > 8) { ship.vx *= 8/spd; ship.vy *= 8/spd; }

    ship.x += ship.vx;
    ship.y += ship.vy;
    wrap(ship);

    if (ship.invincible > 0) ship.invincible--;

    // shooting
    if (bulletCooldown > 0) bulletCooldown--;
    if ((keys['Space'] || keys['KeyF']) && bulletCooldown === 0 && bullets.length < 12) {
      bulletCooldown = 8;
      const bx = ship.x + Math.cos(ship.angle) * 20;
      const by = ship.y + Math.sin(ship.angle) * 20;
      bullets.push({
        x: bx, y: by,
        vx: Math.cos(ship.angle) * 10 + ship.vx * 0.5,
        vy: Math.sin(ship.angle) * 10 + ship.vy * 0.5,
        life: 60, color: WHITE
      });
    }
  } else {
    // respawn
    respawnTimer--;
    if (respawnTimer <= 0 && lives > 0) {
      ship = createShip();
    }
  }

  // Update bullets
  bullets = bullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    b.life--;
    wrap(b);
    return b.life > 0;
  });

  // Update asteroids
  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy;
    a.angle += a.rotSpeed;
    wrap(a);
  });

  // Bullet-asteroid collision
  const newAsteroids = [];
  bullets = bullets.filter(b => {
    let hit = false;
    asteroids = asteroids.filter(a => {
      if (hit) return true;
      if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
        hit = true;
        spawnParticles(a.x, a.y, a.color, 15 + a.size / 3, 3, 30);
        screenShake = 8;
        if (a.size > 22) {
          // split
          const newSize = a.size * 0.55;
          newAsteroids.push(createAsteroid(a.x, a.y, newSize));
          newAsteroids.push(createAsteroid(a.x, a.y, newSize));
          score += 50;
        } else {
          score += 100;
        }
        return false;
      }
      return true;
    });
    return !hit;
  });
  asteroids.push(...newAsteroids);

  // Ship-asteroid collision
  if (ship && ship.invincible <= 0) {
    for (const a of asteroids) {
      if (circlesCollide({x: ship.x, y: ship.y, radius: 12}, a)) {
        spawnParticles(ship.x, ship.y, CYAN, 40, 5, 50);
        spawnParticles(ship.x, ship.y, WHITE, 20, 3, 40);
        screenShake = 20;
        ship = null;
        lives--;
        if (lives <= 0) gameOver = true;
        else respawnTimer = 120;
        break;
      }
    }
  }

  // Next wave
  if (asteroids.length === 0) {
    wave++;
    spawnWave(3 + wave);
  }

  // Update particles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life--;
    return p.life > 0;
  });

  if (screenShake > 0) screenShake--;
}

// --- Draw ---
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake * 1.5,
      (Math.random() - 0.5) * screenShake * 1.5
    );
  }

  // Stars
  const time = performance.now() / 1000;
  stars.forEach(s => {
    const twinkle = (Math.sin(time * s.twinkleSpeed) + 1) / 2;
    const alpha = s.brightness * (0.5 + twinkle * 0.5);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(s.x % W, s.y % H, s.size, s.size);
  });

  // Particles
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Asteroids
  asteroids.forEach(a => {
    drawPoly(a.verts, a.x, a.y, a.angle, a.color, 15);
  });

  // Bullets
  bullets.forEach(b => {
    ctx.shadowColor = WHITE;
    ctx.shadowBlur = 15;
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Ship
  if (ship) {
    // blink when invincible
    if (ship.invincible <= 0 || Math.floor(ship.invincible / 4) % 2 === 0) {
      drawPoly(SHIP_VERTICES, ship.x, ship.y, ship.angle, CYAN, 20);

      // thrust flame
      if (ship.thrustFlicker > 0) {
        const flameLen = 8 + Math.random() * 8;
        const flame = [[-8, -5], [-8 - flameLen, 0], [-8, 5]];
        drawPoly(flame, ship.x, ship.y, ship.angle, ORANGE, 15);
      }
    }
  }

  ctx.restore();

  // HUD
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 10;
  ctx.fillStyle = CYAN;
  ctx.font = '24px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE ${score}`, 30, 40);
  ctx.fillText(`WAVE ${wave}`, 30, 70);

  // Lives
  ctx.save();
  for (let i = 0; i < lives; i++) {
    ctx.save();
    ctx.translate(W - 40 - i * 35, 40);
    ctx.rotate(-Math.PI / 2);
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 8;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const s = 0.6;
    ctx.moveTo(SHIP_VERTICES[0][0]*s, SHIP_VERTICES[0][1]*s);
    for (let j = 1; j < SHIP_VERTICES.length; j++)
      ctx.lineTo(SHIP_VERTICES[j][0]*s, SHIP_VERTICES[j][1]*s);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  ctx.shadowBlur = 0;

  // Game Over
  if (gameOver) {
    ctx.shadowColor = RED;
    ctx.shadowBlur = 20;
    ctx.fillStyle = RED;
    ctx.font = '64px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 20);
    ctx.font = '20px monospace';
    ctx.fillStyle = WHITE;
    ctx.shadowColor = WHITE;
    ctx.shadowBlur = 10;
    ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2 + 30);
    ctx.fillText('PRESS SPACE TO RESTART', W/2, H/2 + 65);
  }
}

// --- Loop ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
