[package]
name = "homage_client"
version = "0.1.0"
edition = "2021"

[dependencies]
avian2d = { workspace = true }
homage_shared = { workspace = true }
bevy = { workspace = true, features = [
  "2d",
  "multi_threaded",
  "bevy_state",
  "bevy_audio",
  "wav",
  "bevy_ui",
  # Layout and rendering are separate features: without bevy_ui_render, UI
  # text computes layout but never draws.
  "bevy_ui_render",
  "bevy_text",
  "default_font",
] }
lightyear = { workspace = true }
