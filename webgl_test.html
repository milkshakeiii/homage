<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebGL Ship Rendering PoC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 15px; left: 15px;
    color: #0ff; font: 14px monospace;
    pointer-events: none; z-index: 10;
    text-shadow: 0 0 8px #0ff;
  }
  #help {
    position: fixed; bottom: 15px; left: 15px;
    color: #888; font: 12px monospace;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<div id="hud"></div>
<div id="help">
  SCROLL to zoom &bull; DRAG to pan &bull; CLICK ship for ability &bull; 1-6 to focus ship &bull; S to stress test
</div>
<canvas id="c"></canvas>
<script>
// ============================================================
// WEBGL SETUP
// ============================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
if (!gl) { document.body.innerHTML = '<h1 style="color:red;padding:40px">WebGL not supported</h1>'; throw 'no webgl'; }

const hudEl = document.getElementById('hud');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); setupFramebuffers(); });

// ============================================================
// SHADER SOURCES
// ============================================================
const SHIP_VS = `
  attribute vec2 aPos;
  uniform mat3 uView;
  void main() {
    vec3 p = uView * vec3(aPos, 1.0);
    gl_Position = vec4(p.xy, 0.0, 1.0);
  }
`;

const SHIP_FS = `
  precision mediump float;
  uniform vec4 uColor;
  void main() {
    gl_FragColor = uColor;
  }
`;

// SDF anti-aliased line shader
const LINE_VS = `
  attribute vec2 aPos;
  attribute float aDist;
  uniform mat3 uView;
  varying float vDist;
  void main() {
    vec3 p = uView * vec3(aPos, 1.0);
    gl_Position = vec4(p.xy, 0.0, 1.0);
    vDist = aDist;
  }
`;

const LINE_FS = `
  precision mediump float;
  uniform vec4 uColor;
  varying float vDist;
  void main() {
    // Expanded quad: core is within 0.6, AA fade from 0.6 to 1.0
    float d = abs(vDist);
    float alpha = 1.0 - smoothstep(0.45, 1.0, d);
    gl_FragColor = vec4(uColor.rgb, uColor.a * alpha);
  }
`;

// Fullscreen quad vertex shader (for post-processing)
const QUAD_VS = `
  attribute vec2 aPos;
  varying vec2 vUV;
  void main() {
    vUV = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
  }
`;

// Gaussian blur (separable, single direction)
const BLUR_FS = `
  precision mediump float;
  varying vec2 vUV;
  uniform sampler2D uTex;
  uniform vec2 uDir; // (1/W, 0) or (0, 1/H)
  void main() {
    vec4 sum = vec4(0.0);
    // 9-tap gaussian
    float weights[5];
    weights[0] = 0.227027;
    weights[1] = 0.194596;
    weights[2] = 0.121622;
    weights[3] = 0.054054;
    weights[4] = 0.016216;
    sum += texture2D(uTex, vUV) * weights[0];
    for (int i = 1; i < 5; i++) {
      vec2 off = uDir * float(i) * 2.0;
      sum += texture2D(uTex, vUV + off) * weights[i];
      sum += texture2D(uTex, vUV - off) * weights[i];
    }
    gl_FragColor = sum;
  }
`;

// Composite: sharp + bloom
const COMPOSITE_FS = `
  precision mediump float;
  varying vec2 vUV;
  uniform sampler2D uSharp;
  uniform sampler2D uBloom;
  uniform float uBloomStrength;
  void main() {
    vec4 sharp = texture2D(uSharp, vUV);
    vec4 bloom = texture2D(uBloom, vUV);
    gl_FragColor = sharp + bloom * uBloomStrength;
  }
`;

// Stars background
const STARS_FS = `
  precision mediump float;
  varying vec2 vUV;
  uniform vec2 uResolution;
  uniform vec2 uCamPos;
  uniform float uZoom;
  uniform float uTime;

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }

  void main() {
    // Single layer of stars in screen space, scrolling with camera
    vec2 screenPos = vUV * uResolution;
    vec2 pos = screenPos + uCamPos * 0.01;
    float cellSize = 60.0;
    vec2 cell = floor(pos / cellSize);
    vec2 cellUV = fract(pos / cellSize);
    float h = hash(cell);
    float brightness = 0.0;
    if (h > 0.93) {
      vec2 starPos = vec2(hash(cell * 1.1), hash(cell * 2.3)) * 0.8 + 0.1;
      float d = length(cellUV - starPos) * cellSize;
      float starRadius = 0.6 + h * 1.0;
      float twinkle = 0.7 + 0.3 * sin(uTime * (1.0 + h * 4.0) + h * 100.0);
      brightness = smoothstep(starRadius, 0.0, d) * (0.2 + h * 0.5) * twinkle;
    }
    gl_FragColor = vec4(vec3(brightness), 1.0);
  }
`;

// ============================================================
// SHADER COMPILATION
// ============================================================
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function createProgram(vs, fs, attribs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
  for (let i = 0; i < attribs.length; i++) gl.bindAttribLocation(p, i, attribs[i]);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('Program error:', gl.getProgramInfoLog(p));
    return null;
  }
  // cache uniform locations
  p.uniforms = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    p.uniforms[info.name] = gl.getUniformLocation(p, info.name);
  }
  return p;
}

const shipProg = createProgram(SHIP_VS, SHIP_FS, ['aPos']);
const lineProg = createProgram(LINE_VS, LINE_FS, ['aPos', 'aDist']);
const blurProg = createProgram(QUAD_VS, BLUR_FS, ['aPos']);
const compositeProg = createProgram(QUAD_VS, COMPOSITE_FS, ['aPos']);
const starsProg = createProgram(QUAD_VS, STARS_FS, ['aPos']);

// Fullscreen quad buffer
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

// ============================================================
// FRAMEBUFFERS for bloom
// ============================================================
let fbSharp, fbBlurA, fbBlurB;

function createFB(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { fb, tex, w, h };
}

function setupFramebuffers() {
  fbSharp = createFB(W, H);
  // Blur at half res for performance
  fbBlurA = createFB(Math.floor(W/2), Math.floor(H/2));
  fbBlurB = createFB(Math.floor(W/2), Math.floor(H/2));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
setupFramebuffers();

// ============================================================
// SHIP GEOMETRY — reuse definitions from showcase
// ============================================================
// Line quads are generated at runtime to keep screen-space width constant
function makeLineQuadPositions(verts) {
  // Store just the edge endpoint pairs — we'll expand to quads in the shader
  // For now, generate quads on CPU each frame based on current zoom
  // Return the raw vertex positions for edge generation
  const n = verts.length;
  const edges = [];
  for (let i = 0; i < n; i++) {
    edges.push(verts[i][0], verts[i][1], verts[(i+1)%n][0], verts[(i+1)%n][1]);
  }
  return { edges: new Float32Array(edges), edgeCount: n };
}

function generateLineQuads(edges, edgeCount, width, zoom) {
  // Screen-space line width: width pixels regardless of zoom
  // Extra 1.8x expansion gives the SDF shader room for smooth AA edges
  const halfW = (width * 1.5 * 1.8) / zoom * 0.5;
  const data = new Float32Array(edgeCount * 18); // 6 verts * 3 floats (x, y, dist) per edge
  for (let i = 0; i < edgeCount; i++) {
    const ax = edges[i*4], ay = edges[i*4+1];
    const bx = edges[i*4+2], by = edges[i*4+3];
    const dx = bx - ax, dy = by - ay;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const nx = -dy/len * halfW, ny = dx/len * halfW;
    const o = i * 18;
    data[o]   = ax+nx; data[o+1] = ay+ny; data[o+2] = 1.0;
    data[o+3] = ax-nx; data[o+4] = ay-ny; data[o+5] = -1.0;
    data[o+6] = bx+nx; data[o+7] = by+ny; data[o+8] = 1.0;
    data[o+9] = bx+nx; data[o+10]= by+ny; data[o+11]= 1.0;
    data[o+12]= ax-nx; data[o+13]= ay-ny; data[o+14]= -1.0;
    data[o+15]= bx-nx; data[o+16]= by-ny; data[o+17]= -1.0;
  }
  return data;
}

function makeShipBuffers(parts) {
  return parts.map(part => {
    const verts = part.verts;
    // Fill buffer (triangle fan)
    const flat = new Float32Array(verts.length * 2);
    for (let i = 0; i < verts.length; i++) {
      flat[i*2] = verts[i][0];
      flat[i*2+1] = verts[i][1];
    }
    const fillBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, fillBuf);
    gl.bufferData(gl.ARRAY_BUFFER, flat, gl.STATIC_DRAW);

    // Edge data for dynamic line quad generation
    const edgeData = makeLineQuadPositions(verts);
    const strokeBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, strokeBuf);
    gl.bufferData(gl.ARRAY_BUFFER, edgeData.edgeCount * 18 * 4, gl.DYNAMIC_DRAW); // pre-allocate (3 floats per vert)

    return {
      fillBuf,
      fillCount: verts.length,
      strokeBuf,
      edges: edgeData.edges,
      edgeCount: edgeData.edgeCount,
      stroke: parseColor(part.stroke),
      fill: parseColor(part.fill),
      width: part.width
    };
  });
}

function parseColor(css) {
  if (css.startsWith('rgba')) {
    const m = css.match(/[\d.]+/g);
    return [+m[0]/255, +m[1]/255, +m[2]/255, +m[3]];
  }
  if (css.startsWith('#')) {
    if (css.length === 4) {
      const r = parseInt(css[1]+css[1], 16)/255;
      const g = parseInt(css[2]+css[2], 16)/255;
      const b = parseInt(css[3]+css[3], 16)/255;
      return [r, g, b, 1.0];
    }
    const r = parseInt(css.slice(1,3), 16)/255;
    const g = parseInt(css.slice(3,5), 16)/255;
    const b = parseInt(css.slice(5,7), 16)/255;
    return [r, g, b, 1.0];
  }
  return [1,1,1,1];
}

// Ship definitions (same vertex data as showcase)
function makeSkiff() {
  return {
    parts: [
      { verts: [[5,0],[3,1.2],[1,1.8],[-3,2.5],[-5,2],[-4.5,0.8],[-5,0],[-4.5,-0.8],[-5,-2],[-3,-2.5],[1,-1.8],[3,-1.2]], stroke:'#0ff', fill:'rgba(0,255,255,0.08)', width:1.5 },
      { verts: [[4,0],[2.5,0.8],[1,0.6],[1,-0.6],[2.5,-0.8]], stroke:'#0ff', fill:'rgba(0,255,255,0.25)', width:1 },
      { verts: [[-5,1.2],[-6.5,1.5],[-6.5,0.5],[-5,0.8]], stroke:'#f80', fill:'rgba(255,136,0,0.3)', width:1 },
      { verts: [[-5,-0.8],[-6.5,-0.5],[-6.5,-1.5],[-5,-1.2]], stroke:'#f80', fill:'rgba(255,136,0,0.3)', width:1 },
      { verts: [[0,1.8],[-1,3.5],[-3,3.2],[-2,2.2]], stroke:'#088', fill:'rgba(0,136,136,0.15)', width:1 },
      { verts: [[0,-1.8],[-1,-3.5],[-3,-3.2],[-2,-2.2]], stroke:'#088', fill:'rgba(0,136,136,0.15)', width:1 },
    ],
    length: 10, name: 'SKIFF', color: '#0ff'
  };
}

function makeCorvette() {
  return {
    parts: [
      { verts: [[25,0],[20,4],[12,6],[5,7],[-10,8],[-20,6],[-25,3],[-25,-3],[-20,-6],[-10,-8],[5,-7],[12,-6],[20,-4]], stroke:'#f0f', fill:'rgba(255,0,255,0.06)', width:1.5 },
      { verts: [[10,3],[5,5],[-2,5],[-5,3],[-5,-3],[-2,-5],[5,-5],[10,-3]], stroke:'#f0f', fill:'rgba(255,0,255,0.15)', width:1 },
      { verts: [[22,3],[28,2.5],[28,4],[22,4.5]], stroke:'#f88', fill:'rgba(255,136,136,0.3)', width:1 },
      { verts: [[22,-4.5],[28,-4],[28,-2.5],[22,-3]], stroke:'#f88', fill:'rgba(255,136,136,0.3)', width:1 },
      { verts: [[-25,5],[-32,4],[-32,-4],[-25,-5]], stroke:'#f80', fill:'rgba(255,136,0,0.2)', width:1.5 },

  };
}

function makeFrigate() {
  return {
    parts: [
      { verts: [[75,0],[65,8],[50,12],[20,15],[-20,16],[-50,14],[-70,10],[-75,5],[-75,-5],[-70,-10],[-50,-14],[-20,-16],[20,-15],[50,-12],[65,-8]], stroke:'#0f0', fill:'rgba(0,255,0,0.05)', width:2 },
      { verts: [[30,6],[15,10],[-5,10],[-15,7],[-15,-7],[-5,-10],[15,-10],[30,-6]], stroke:'#0f0', fill:'rgba(0,255,0,0.12)', width:1.5 },
      { verts: [[40,8],[35,12],[25,12],[20,8]], stroke:'#8f8', fill:'rgba(136,255,136,0.2)', width:1 },
      { verts: [[40,-8],[35,-12],[25,-12],[20,-8]], stroke:'#8f8', fill:'rgba(136,255,136,0.2)', width:1 },
      { verts: [[-75,8],[-85,6],[-85,2],[-75,3]], stroke:'#f80', fill:'rgba(255,136,0,0.3)', width:1 },
      { verts: [[-75,-3],[-85,-2],[-85,-6],[-75,-8]], stroke:'#f80', fill:'rgba(255,136,0,0.3)', width:1 },
    ],
    length: 150, name: 'FRIGATE', color: '#0f0'
  };
}

function makeDestroyer() {
  const gunsL = [], gunsR = [];
  for (let i = 0; i < 6; i++) {
    const x = 120 - i * 50;
    gunsL.push({ verts: [[x,55+i*2],[x+10,65+i*2],[x+5,78+i*2],[x-5,78+i*2],[x-10,65+i*2]], stroke:'#ff8', fill:'rgba(255,255,136,0.15)', width:1 });
    gunsR.push({ verts: [[x,-55-i*2],[x+10,-65-i*2],[x+5,-78-i*2],[x-5,-78-i*2],[x-10,-65-i*2]], stroke:'#ff8', fill:'rgba(255,255,136,0.15)', width:1 });
  }
  const engines = [];
  for (let i = -3; i <= 3; i++) {
    engines.push({ verts: [[-200,i*9+4],[-218,i*9+3],[-218,i*9-3],[-200,i*9-4]], stroke:'#f80', fill:'rgba(255,136,0,0.3)', width:1 });
  }
  return {
    parts: [
      { verts: [[200,0],[180,25],[120,50],[40,65],[-40,70],[-120,68],[-180,55],[-200,35],[-200,-35],[-180,-55],[-120,-68],[-40,-70],[40,-65],[120,-50],[180,-25]], stroke:'#ff0', fill:'rgba(255,255,0,0.04)', width:2 },
      { verts: [[200,0],[190,18],[160,30],[120,30],[120,-30],[160,-30],[190,-18]], stroke:'#ff0', fill:'rgba(255,255,0,0.1)', width:1.5 },
      { verts: [[60,25],[30,45],[-30,48],[-60,40],[-60,-40],[-30,-48],[30,-45],[60,-25]], stroke:'#ff0', fill:'rgba(255,255,0,0.1)', width:1.5 },
      { verts: [[100,8],[50,12],[-50,12],[-100,8],[-100,-8],[-50,-12],[50,-12],[100,-8]], stroke:'#880', fill:'rgba(136,136,0,0.08)', width:1 },
      { verts: [[80,50],[20,62],[-60,65],[-120,60],[-100,50],[-20,48],[60,42]], stroke:'#aa0', fill:'rgba(170,170,0,0.06)', width:1 },
      { verts: [[80,-50],[20,-62],[-60,-65],[-120,-60],[-100,-50],[-20,-48],[60,-42]], stroke:'#aa0', fill:'rgba(170,170,0,0.06)', width:1 },
      ...gunsL, ...gunsR, ...engines,
    ],
    length: 400, name: 'DESTROYER', color: '#ff0'
  };
}

function makeCruiser() {
  const engines = [];
  for (const baseY of [-70, -90, 70, 90]) {
    engines.push({ verts: [[-400,baseY+6],[-430,baseY+4],[-430,baseY-4],[-400,baseY-6]], stroke:'#f80', fill:'rgba(255,136,0,0.3)', width:1.5 });

  return {
    parts: [
      { verts: [[400,-60],[380,-40],[300,-30],[100,-25],[-100,-25],[-300,-30],[-380,-40],[-400,-60],[-400,-100],[-380,-110],[-300,-120],[-100,-125],[100,-125],[300,-120],[380,-110],[400,-100]], stroke:'#f80', fill:'rgba(255,136,0,0.04)', width:2.5 },
      { verts: [[400,60],[380,40],[300,30],[100,25],[-100,25],[-300,30],[-380,40],[-400,60],[-400,100],[-380,110],[-300,120],[-100,125],[100,125],[300,120],[380,110],[400,100]], stroke:'#f80', fill:'rgba(255,136,0,0.04)', width:2.5 },
      { verts: [[120,-25],[120,25],[-120,25],[-120,-25]], stroke:'#fa0', fill:'rgba(255,170,0,0.06)', width:2 },

      { verts: [[250,100],[240,130],[220,130],[210,100]], stroke:'#f88', fill:'rgba(255,136,136,0.15)', width:1 },
      { verts: [[-100,100],[-110,130],[-130,130],[-140,100]], stroke:'#f88', fill:'rgba(255,136,136,0.15)', width:1 },

function makeMothership() {
  const R = 900;
  const hull = [], inner = [], bridge = [];
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2 - Math.PI/6;
    hull.push([Math.cos(a)*R, Math.sin(a)*R]);
    inner.push([Math.cos(a)*R*0.5, Math.sin(a)*R*0.5]);
    bridge.push([Math.cos(a)*R*0.2, Math.sin(a)*R*0.2]);
  }
  const spokes = [];
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2 - Math.PI/6;
    const cos = Math.cos(a), sin = Math.sin(a), w = 25;
    const pa = a + Math.PI/2;
    const dx = Math.cos(pa)*w, dy = Math.sin(pa)*w;
    spokes.push({ verts: [
      [cos*R*0.52+dx,sin*R*0.52+dy],[cos*R*0.95+dx,sin*R*0.95+dy],
      [cos*R*0.95-dx,sin*R*0.95-dy],[cos*R*0.52-dx,sin*R*0.52-dy]
    ], stroke:'#66c', fill:'rgba(100,100,200,0.06)', width:1.5 });
  }
  const bays = [];
  for (let i = 0; i < 6; i++) {
    const a1 = (i/6)*Math.PI*2 - Math.PI/6;
    const a2 = ((i+1)/6)*Math.PI*2 - Math.PI/6;
    const mid = (a1+a2)/2;
    const bx = Math.cos(mid)*R*0.72, by = Math.sin(mid)*R*0.72;
    const pa = mid+Math.PI/2, bw=60, bh=30;
    bays.push({ verts: [
      [bx+Math.cos(mid)*bh+Math.cos(pa)*bw,by+Math.sin(mid)*bh+Math.sin(pa)*bw],
      [bx-Math.cos(mid)*bh+Math.cos(pa)*bw,by-Math.sin(mid)*bh+Math.sin(pa)*bw],
      [bx-Math.cos(mid)*bh-Math.cos(pa)*bw,by-Math.sin(mid)*bh-Math.sin(pa)*bw],
      [bx+Math.cos(mid)*bh-Math.cos(pa)*bw,by+Math.sin(mid)*bh-Math.sin(pa)*bw]
    ], stroke:'#48f', fill:'rgba(68,136,255,0.12)', width:1.5 });
  }
  const engines = [];
  for (let i = -3; i <= 3; i++) {
    const ey = i*30;
    engines.push({ verts: [[-R-10,ey+12],[-R-55,ey+8],[-R-55,ey-8],[-R-10,ey-12]], stroke:'#f80', fill:'rgba(255,136,0,0.3)', width:2 });
  }
  return {
    parts: [
      { verts: hull, stroke:'#88f', fill:'rgba(136,136,255,0.03)', width:3 },
      { verts: inner, stroke:'#88f', fill:'rgba(136,136,255,0.05)', width:2 },
      { verts: bridge, stroke:'#aaf', fill:'rgba(170,170,255,0.1)', width:2 },
      ...spokes, ...bays,
      { verts: [[0,-R-10],[-20,-R-60],[20,-R-60]], stroke:'#ff0', fill:'rgba(255,255,0,0.15)', width:1 },
      { verts: [[0,R+10],[-20,R+60],[20,R+60]], stroke:'#ff0', fill:'rgba(255,255,0,0.15)', width:1 },
      ...engines,
    ],
    length: 2000, name: 'MOTHERSHIP', color: '#88f'
  };
}

// ============================================================
// DYNAMIC GEOMETRY BUFFER (for effects)
// ============================================================
const MAX_DYN_VERTS = 20000;
const dynBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, dynBuf);
gl.bufferData(gl.ARRAY_BUFFER, MAX_DYN_VERTS * 8, gl.DYNAMIC_DRAW);
let dynVerts = new Float32Array(MAX_DYN_VERTS * 2);
let dynCount = 0;

function dynReset() { dynCount = 0; }

function dynQuad(x1,y1,x2,y2,x3,y3,x4,y4) {
  if (dynCount + 6 > MAX_DYN_VERTS) return;
  const o = dynCount * 2;
  dynVerts[o]=x1; dynVerts[o+1]=y1; dynVerts[o+2]=x2; dynVerts[o+3]=y2; dynVerts[o+4]=x3; dynVerts[o+5]=y3;
  dynVerts[o+6]=x3; dynVerts[o+7]=y3; dynVerts[o+8]=x2; dynVerts[o+9]=y2; dynVerts[o+10]=x4; dynVerts[o+11]=y4;
  dynCount += 6;
}

function dynCircle(cx, cy, r, segs) {
  if (dynCount + segs * 3 > MAX_DYN_VERTS) return;
  for (let i = 0; i < segs; i++) {
    const a1 = (i/segs)*Math.PI*2, a2 = ((i+1)/segs)*Math.PI*2;
    const o = dynCount * 2;
    dynVerts[o]=cx; dynVerts[o+1]=cy;
    dynVerts[o+2]=cx+Math.cos(a1)*r; dynVerts[o+3]=cy+Math.sin(a1)*r;
    dynVerts[o+4]=cx+Math.cos(a2)*r; dynVerts[o+5]=cy+Math.sin(a2)*r;
    dynCount += 3;
  }
}

// Separate dynamic line buffer (interleaved x,y,dist for SDF AA)
const dynLineBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, dynLineBuf);
gl.bufferData(gl.ARRAY_BUFFER, MAX_DYN_VERTS * 12, gl.DYNAMIC_DRAW);
let dynLineVerts = new Float32Array(MAX_DYN_VERTS * 3);
let dynLineCount = 0;

function dynLine(ax,ay,bx,by,hw) {
  if (dynLineCount + 6 > MAX_DYN_VERTS) return;
  const dx=bx-ax, dy=by-ay, len=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=-dy/len*hw, ny=dx/len*hw;
  const o = dynLineCount * 3;
  dynLineVerts[o]   = ax+nx; dynLineVerts[o+1] = ay+ny; dynLineVerts[o+2] = 1.0;
  dynLineVerts[o+3] = ax-nx; dynLineVerts[o+4] = ay-ny; dynLineVerts[o+5] = -1.0;
  dynLineVerts[o+6] = bx+nx; dynLineVerts[o+7] = by+ny; dynLineVerts[o+8] = 1.0;
  dynLineVerts[o+9] = bx+nx; dynLineVerts[o+10]= by+ny; dynLineVerts[o+11]= 1.0;
  dynLineVerts[o+12]= ax-nx; dynLineVerts[o+13]= ay-ny; dynLineVerts[o+14]= -1.0;
  dynLineVerts[o+15]= bx-nx; dynLineVerts[o+16]= by-ny; dynLineVerts[o+17]= -1.0;
  dynLineCount += 6;
}

function dynLineFlush(viewMatrix, color) {
  if (dynLineCount === 0) return;
  gl.useProgram(lineProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, dynLineBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, dynLineVerts.subarray(0, dynLineCount * 3));
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 12, 0);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 12, 8);
  gl.enableVertexAttribArray(1);
  gl.uniformMatrix3fv(lineProg.uniforms.uView, false, viewMatrix);
  gl.uniform4fv(lineProg.uniforms.uColor, color);
  gl.drawArrays(gl.TRIANGLES, 0, dynLineCount);
  dynLineCount = 0;
  gl.disableVertexAttribArray(1);
  gl.useProgram(shipProg);
}

function dynFlush(viewMatrix, color) {
  if (dynCount === 0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, dynBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, dynVerts.subarray(0, dynCount*2));
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  gl.uniformMatrix3fv(shipProg.uniforms.uView, false, viewMatrix);
  gl.uniform4fv(shipProg.uniforms.uColor, color);
  gl.drawArrays(gl.TRIANGLES, 0, dynCount);
  dynReset();
}

// ============================================================
// ABILITY LOGIC
// ============================================================
function triggerAbility(ship) {
  switch (ship.abilityName) {
    case 'AFTERBURNER': ship.ability = {type:'afterburner',timer:0,max:90}; break;
    case 'MISSILE SALVO': ship.ability = {type:'missiles',timer:0,max:120,missiles:[]}; break;
    case 'SHIELD BUBBLE': ship.ability = {type:'shield',timer:0,max:150}; break;
    case 'BROADSIDE': ship.ability = {type:'broadside',timer:0,max:100,flashes:[]}; break;
    case 'ENERGY LANCE': ship.ability = {type:'lance',timer:0,max:120}; break;
    case 'DEPLOY FIGHTERS': ship.ability = {type:'fighters',timer:0,max:180,fighters:[]}; break;
  }
}

function updateAbility(ship, time) {
  const ab = ship.ability;
  if (!ab) return;
  ab.timer++;
  const t = ab.timer / ab.max;
  const {x, y, def} = ship;
  const len = def.length;

  switch (ab.type) {
    case 'afterburner': {
      const intensity = Math.sin(t * Math.PI);
      for (let i = 0; i < 3; i++) {
        const spread = (Math.random()-0.5)*len*0.4;
        const speed = len*0.3 + Math.random()*len*0.2;
        spawnP(x-len*0.5+spread*0.3, y+spread,
          -speed*(0.5+intensity), (Math.random()-0.5)*len*0.1,
          Math.random()>0.5?'#f80':'#ff0', 20+Math.random()*20, len*0.05*intensity+1);
      }
      break;
    }
    case 'missiles': {
      if (ab.timer%8===0 && ab.timer<60) {
        const my = (Math.random()-0.5)*len*0.6;
        ab.missiles.push({x:x+len*0.2, y:y+my, vx:len*0.08+Math.random()*len*0.05, vy:my*0.05, trail:[], life:80});
      }
      ab.missiles = ab.missiles.filter(m => {
        m.x+=m.vx; m.y+=m.vy; m.vy+=(Math.random()-0.5)*0.5;
        m.trail.push({x:m.x,y:m.y}); if(m.trail.length>15) m.trail.shift();
        m.life--;
        if (m.life<=0) {
          for (let i=0;i<8;i++) { const a=Math.random()*Math.PI*2; spawnP(m.x,m.y,Math.cos(a)*len*0.05,Math.sin(a)*len*0.05,'#f80',20,len*0.02); }
        }
        return m.life>0;
      });
      break;
    }
    case 'shield': break; // drawn in render
    case 'broadside': {
      const fireRate=10, startDelay=10, elapsed=ab.timer-startDelay;
      if (elapsed>=0 && elapsed%fireRate===0 && elapsed<fireRate*6) {
        const gunIdx=Math.floor(elapsed/fireRate), gunX=120-gunIdx*50;
        ab.flashes.push({timer:20, x:x+gunX, yTop:y+65+gunIdx*2, yBot:y-65-gunIdx*2});
      }
      ab.flashes = ab.flashes.filter(f => {
        f.timer--;
        if (f.timer%3===0) {
          for (const fy of [f.yTop,f.yBot]) {
            const dir=fy>y?1:-1;
            spawnP(f.x,fy,(Math.random()-0.5)*len*0.02,dir*len*0.08,'#ff0',15,len*0.01);
          }
        }
        return f.timer>0;
      });
      break;
    }
    case 'lance': {
      const chargeT=0.4;
      if (t<chargeT) {
        const ct=t/chargeT, radius=len*(1-ct)*0.8;
        for (let i=0;i<2;i++) {
          const a=Math.random()*Math.PI*2, r=radius*(0.5+Math.random()*0.5);
          spawnP(x+len*0.3+Math.cos(a)*r, y+Math.sin(a)*r, -Math.cos(a)*len*0.05*ct, -Math.sin(a)*len*0.05*ct, '#f44',10,len*0.005*(1+ct*2));
        }
      }
      break;
    }
    case 'fighters': {
      if (ab.timer%15===0 && ab.fighters.length<18) {
        const bayIdx=Math.floor(Math.random()*6);
        const a1=(bayIdx/6)*Math.PI*2-Math.PI/6, a2=((bayIdx+1)/6)*Math.PI*2-Math.PI/6, mid=(a1+a2)/2;
        const bx=x+Math.cos(mid)*len*0.36, by=y+Math.sin(mid)*len*0.36;
        ab.fighters.push({x:bx,y:by, vx:Math.cos(mid)*len*0.02+(Math.random()-0.5)*len*0.005, vy:Math.sin(mid)*len*0.02+(Math.random()-0.5)*len*0.005, angle:mid, life:120+Math.random()*60});
      }
      ab.fighters = ab.fighters.filter(f => {
        f.x+=f.vx; f.y+=f.vy; f.vx*=1.01; f.angle=Math.atan2(f.vy,f.vx); f.life--;
        if (f.life%2===0) spawnP(f.x,f.y,-f.vx*0.3,-f.vy*0.3,'#48f',15,len*0.003);
        return f.life>0;
      });
      break;
    }
  }
  if (ab.timer >= ab.max) ship.ability = null;
}

function drawAbility(ship, viewMatrix, time) {
  const ab = ship.ability;
  if (!ab) return;
  const t = ab.timer / ab.max;
  const {x, y, def} = ship;
  const len = def.length;

  switch (ab.type) {
    case 'missiles': {
      // Draw missile trails and heads
      for (const m of ab.missiles) {
        // Trail (uses line shader for AA)
        if (m.trail.length > 1) {
          for (let i = 0; i < m.trail.length-1; i++) {
            dynLine(m.trail[i].x, m.trail[i].y, m.trail[i+1].x, m.trail[i+1].y, len*0.005);
          }
          dynLineFlush(viewMatrix, [1,0.27,0.27,0.8]);
        }
        // Head
        dynReset();
        dynCircle(m.x, m.y, len*0.01, 8);
        dynFlush(viewMatrix, [1,1,1,1]);
      }
      break;
    }
    case 'shield': {
      const radius = len * 0.7;
      const pulse = 0.9 + 0.1 * Math.sin(time*10);
      const alpha = Math.sin(t * Math.PI) * 0.6;
      const r = radius * pulse;
      // Hex shield segments (lines with AA)
      for (let i = 0; i < 6; i++) {
        const a1 = (i/6)*Math.PI*2+time*0.5, a2 = ((i+1)/6)*Math.PI*2+time*0.5;
        const segAlpha = alpha * (0.5 + 0.5*Math.sin(time*6+i));
        dynLine(x+Math.cos(a1)*r, y+Math.sin(a1)*r, x+Math.cos(a2)*r, y+Math.sin(a2)*r, len*0.01);
        dynLineFlush(viewMatrix, [0,1,1,segAlpha]);
      }
      break;
    }
    case 'broadside': {
      for (const f of ab.flashes) {
        const alpha = f.timer / 20;
        const flashLen = len * 0.2;
        for (const fy of [f.yTop, f.yBot]) {
          const dir = fy > y ? 1 : -1;
          dynLine(f.x, fy, f.x, fy + dir*flashLen, len*0.015);
          dynLineFlush(viewMatrix, [1,1,0.4,alpha]);
          // Muzzle flash circle
          dynReset();
          dynCircle(f.x, fy, len*0.02*alpha, 8);
          dynFlush(viewMatrix, [1,1,0.8,alpha]);
        }
      }
      break;
    }
    case 'lance': {
      const chargeT = 0.4;
      if (t < chargeT) {
        // Charge point
        const ct = t/chargeT;
        dynReset();
        dynCircle(x+len*0.3, y, len*0.03*ct*2, 12);
        dynFlush(viewMatrix, [1,0.27,0.27,ct]);
      } else {
        // Beam
        const ft = (t-chargeT)/(1-chargeT);
        const beamAlpha = ft < 0.1 ? ft/0.1 : (1-ft);
        const beamLen = len * 5;
        const beamW = len * 0.04 * (1 + Math.sin(time*30)*0.2);
        dynLine(x+len*0.3, y, x+len*0.3+beamLen, y, beamW);
        dynLineFlush(viewMatrix, [1,0.4,0.4,beamAlpha]);
        // Bright core
        dynLine(x+len*0.3, y, x+len*0.3+beamLen, y, beamW*0.3);
        dynLineFlush(viewMatrix, [1,0.85,0.85,beamAlpha*0.8]);
      }
      break;
    }
    case 'fighters': {
      // Draw mini fighter shapes
      const miniVerts = [[4,0],[-2,-2],[-3,0],[-2,2]];
      const scale = len * 0.012;
      for (const f of ab.fighters) {
        const alpha = Math.min(1, f.life/30);
        const cos = Math.cos(f.angle), sin = Math.sin(f.angle);
        dynReset();
        // Transform mini verts and draw as triangle fan (approximate with quads)
        const tx = [];
        for (const v of miniVerts) {
          tx.push(f.x + (v[0]*cos - v[1]*sin)*scale, f.y + (v[0]*sin + v[1]*cos)*scale);
        }
        // Two triangles for the diamond shape
        const o = dynCount * 2;
        dynVerts[o]=tx[0]; dynVerts[o+1]=tx[1]; dynVerts[o+2]=tx[2]; dynVerts[o+3]=tx[3]; dynVerts[o+4]=tx[4]; dynVerts[o+5]=tx[5];
        dynVerts[o+6]=tx[0]; dynVerts[o+7]=tx[1]; dynVerts[o+8]=tx[4]; dynVerts[o+9]=tx[5]; dynVerts[o+10]=tx[6]; dynVerts[o+11]=tx[7];
        dynCount += 6;
        dynFlush(viewMatrix, [0.27,0.53,1,alpha]);
      }
      break;
    }
  }
}

// ============================================================
// CAMERA
// ============================================================
const camera = { x: 0, y: 0, zoom: 0.15, targetZoom: 0.15, targetX: 0, targetY: 0 };

// ============================================================
// INPUT
// ============================================================
let dragging = false, dragStartX, dragStartY, camStartX, camStartY;

canvas.addEventListener('mousedown', e => {
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  camStartX = camera.targetX; camStartY = camera.targetY;
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  camera.targetX = camStartX - (e.clientX - dragStartX) / camera.zoom;
  camera.targetY = camStartY - (e.clientY - dragStartY) / camera.zoom;
});
canvas.addEventListener('mouseup', e => {
  if (!dragging) return;
  // If mouse didn't move much, treat as click → trigger ability
  const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
  if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
    // Convert click to world coords
    const wx = (e.clientX - W/2) / camera.zoom + camera.x;
    const wy = (e.clientY - H/2) / camera.zoom + camera.y;
    // Find closest ship within click radius
    let best = null, bestDist = Infinity;
    for (const s of ships) {
      const d = Math.hypot(wx - s.x, wy - s.y);
      const hitR = s.def.length * 0.8;
      if (d < hitR && d < bestDist) { best = s; bestDist = d; }
    }
    if (best && !best.ability) triggerAbility(best);
  }
  dragging = false;
});
canvas.addEventListener('wheel', e => {
  const factor = e.deltaY > 0 ? 0.85 : 1.18;
  camera.targetZoom = Math.max(0.003, Math.min(40, camera.targetZoom * factor));
  e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
  const idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx < ships.length) {
    const s = ships[idx];
    camera.targetX = s.x;
    camera.targetY = s.y;
    camera.targetZoom = Math.min(40, W / (s.def.length * 4));
  }
  if (e.key === 's' || e.key === 'S') {
    stressMode = !stressMode;
    if (stressMode && stressShips.length === 0) generateStressShips();
  }
});

// ============================================================
// RENDERING
// ============================================================
function buildViewMatrix(cx, cy, zoom) {
  // World to NDC: scale by zoom, translate by camera, map to [-1,1]
  const sx = 2 * zoom / W;
  const sy = -2 * zoom / H; // flip Y
  const tx = -cx * sx;
  const ty = -cy * sy;
  return new Float32Array([sx, 0, 0, 0, sy, 0, tx, ty, 1]);
}

function drawShipGL(ship, viewMatrix, zoom) {
  // Build per-ship view matrix with position and rotation
  const cos = Math.cos(ship.angle), sin = Math.sin(ship.angle);
  const vm = viewMatrix;
  const tx = ship.x, ty = ship.y;
  const m = new Float32Array([
    vm[0] * cos + vm[3] * sin,
    vm[1] * cos + vm[4] * sin,
    0,
    vm[0] * -sin + vm[3] * cos,
    vm[1] * -sin + vm[4] * cos,
    0,
    vm[0] * tx + vm[3] * ty + vm[6],
    vm[1] * tx + vm[4] * ty + vm[7],
    1
  ]);
  gl.uniformMatrix3fv(shipProg.uniforms.uView, false, m);

  for (const part of ship.buffers) {
    // Fill
    if (part.fill[3] > 0.01) {
      gl.bindBuffer(gl.ARRAY_BUFFER, part.fillBuf);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(0);
      gl.uniform4fv(shipProg.uniforms.uColor, part.fill);
      gl.drawArrays(gl.TRIANGLE_FAN, 0, part.fillCount);
    }

    // Stroke (SDF anti-aliased line quads)
    gl.useProgram(lineProg);
    gl.uniformMatrix3fv(lineProg.uniforms.uView, false, m);
    gl.uniform4fv(lineProg.uniforms.uColor, part.stroke);
    const lineData = generateLineQuads(part.edges, part.edgeCount, part.width, zoom);
    gl.bindBuffer(gl.ARRAY_BUFFER, part.strokeBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, lineData);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 12, 0); // aPos
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 12, 8); // aDist
    gl.enableVertexAttribArray(1);
    gl.drawArrays(gl.TRIANGLES, 0, part.edgeCount * 6);
    gl.disableVertexAttribArray(1);
    gl.useProgram(shipProg);
  }
}

function drawFullscreenQuad() {
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = performance.now();
let fps = 0, frameCount = 0, fpsTime = 0;

function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  const time = now / 1000;

  // Smooth camera
  const sm = 0.08;
  camera.x += (camera.targetX - camera.x) * sm;
  camera.y += (camera.targetY - camera.y) * sm;
  camera.zoom += (camera.targetZoom - camera.zoom) * sm;

  gl.viewport(0, 0, W, H);
  const viewMatrix = buildViewMatrix(camera.x, camera.y, camera.zoom);

  // === PASS 1: Render ships to fbSharp ===
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbSharp.fb);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // Stars background
  gl.useProgram(starsProg);
  gl.uniform2f(starsProg.uniforms.uResolution, W, H);
  gl.uniform2f(starsProg.uniforms.uCamPos, camera.x, camera.y);
  gl.uniform1f(starsProg.uniforms.uZoom, camera.zoom);
  gl.uniform1f(starsProg.uniforms.uTime, time);
  drawFullscreenQuad();

  // Ships
  gl.useProgram(shipProg);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  // Update abilities and particles
  for (const s of ships) updateAbility(s, time);
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life--;
    return p.life > 0;
  });

  const allShips = stressMode ? [...ships, ...stressShips] : ships;
  for (const ship of allShips) {
    drawShipGL(ship, viewMatrix, camera.zoom);
  }

  // Draw ability effects
  for (const s of ships) drawAbility(s, viewMatrix, time);

  // Draw particles
  if (particles.length > 0) {
    dynReset();
    let batchColor = null;
    const batches = [];
    // Group particles by color for fewer draw calls
    const colorMap = new Map();
    for (const p of particles) {
      const key = p.color.join(',');
      if (!colorMap.has(key)) colorMap.set(key, []);
      colorMap.get(key).push(p);
    }
    for (const [key, ps] of colorMap) {
      dynReset();
      for (const p of ps) {
        const alpha = p.life / p.maxLife;
        const sz = p.size * alpha;
        if (sz > 0.1) dynCircle(p.x, p.y, sz, 6);
      }
      const c = ps[0].color;
      const avgAlpha = ps.reduce((a,p) => a + p.life/p.maxLife, 0) / ps.length;
      dynFlush(viewMatrix, [c[0], c[1], c[2], avgAlpha]);
    }
  }

  // === PASS 2: Blur for bloom ===
  gl.disable(gl.BLEND);

  // Downsample sharp to blurA (horizontal blur)
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbBlurA.fb);
  gl.viewport(0, 0, fbBlurA.w, fbBlurA.h);
  gl.useProgram(blurProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fbSharp.tex);
  gl.uniform1i(blurProg.uniforms.uTex, 0);
  gl.uniform2f(blurProg.uniforms.uDir, 1.0/fbBlurA.w, 0);
  drawFullscreenQuad();

  // Vertical blur: blurA -> blurB
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbBlurB.fb);
  gl.bindTexture(gl.TEXTURE_2D, fbBlurA.tex);
  gl.uniform2f(blurProg.uniforms.uDir, 0, 1.0/fbBlurA.h);
  drawFullscreenQuad();

  // Additional blur passes for wider glow
  for (let pass = 0; pass < 2; pass++) {
    const spread = (pass + 1) * 1.5;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbBlurA.fb);
    gl.bindTexture(gl.TEXTURE_2D, fbBlurB.tex);
    gl.uniform2f(blurProg.uniforms.uDir, spread/fbBlurA.w, 0);
    drawFullscreenQuad();

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbBlurB.fb);
    gl.bindTexture(gl.TEXTURE_2D, fbBlurA.tex);
    gl.uniform2f(blurProg.uniforms.uDir, 0, spread/fbBlurA.h);
    drawFullscreenQuad();
  }

  // === PASS 3: Composite to screen ===
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(compositeProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fbSharp.tex);
  gl.uniform1i(compositeProg.uniforms.uSharp, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, fbBlurB.tex);
  gl.uniform1i(compositeProg.uniforms.uBloom, 1);
  gl.uniform1f(compositeProg.uniforms.uBloomStrength, 2.0);
  drawFullscreenQuad();

  // HUD (use 2D overlay)
  frameCount++;
  fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(frameCount / fpsTime); frameCount = 0; fpsTime = 0; }

  const shipCount = allShips.length;
  const zoomMeters = W / camera.zoom;
  let scaleLabel;
  if (zoomMeters < 100) scaleLabel = `~${Math.round(zoomMeters)}m across`;
  else if (zoomMeters < 2000) scaleLabel = `~${(zoomMeters/1000).toFixed(1)}km across`;
  else scaleLabel = `~${Math.round(zoomMeters/1000)}km across`;

  hudEl.innerHTML = `FPS: ${fps}<br>SHIPS: ${shipCount}<br>ZOOM: ${camera.zoom.toFixed(3)} px/m<br>${scaleLabel}`;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
