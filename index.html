<head>

<title>Homage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: crosshair; }

  #hud {
    position: fixed; top: 15px; left: 15px;

    position: fixed; bottom: 15px; left: 15px;
    color: #888; font: 12px monospace;

  }

</head>

<div id="hud"></div>
<div id="help">
  WASD to move &bull; SCROLL to zoom &bull; CLICK to fire &bull; 1-6 to select ship class
