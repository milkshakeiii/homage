<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Homage — Steering Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 15px; left: 15px;
    color: #0ff; font: 14px monospace;
    pointer-events: none; z-index: 10;
    text-shadow: 0 0 8px #0ff;
  }
  #help {
    position: fixed; bottom: 15px; left: 15px;
    color: #888; font: 12px monospace;
    pointer-events: none; z-index: 10;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="hud"></div>
<div id="help">
  WASD pan &bull; MIDDLE-DRAG pan &bull; SCROLL zoom &bull; SPACE snap to flagship &bull; F fullscreen<br>
  LEFT-CLICK select &bull; SHIFT+CLICK multi &bull; TAB cycle &bull; RIGHT-CLICK move<br>
  C collision &bull; O orbit &bull; K keep range &bull; E evasive &bull; X stop<br>
  T enemy patrol &bull; G debug &bull; 1-6 spawn at cursor
</div>
<canvas id="c"></canvas>
<script type="module" src="/src/game/SteeringDemo.ts"></script>
</body>
</html>
